name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (fmt + test)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: rerouter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Lets the DB-gated tests (e.g. tests/state_recovery.rs) actually run.
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/rerouter_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: cargo fmt --check
        working-directory: backend-rust
        run: cargo fmt --check
      - name: cargo test
        working-directory: backend-rust
        run: cargo test

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run build
        working-directory: frontend
        run: npm run build
