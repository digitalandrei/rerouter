name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: rerouter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Lets the DB-gated tests (e.g. tests/state_recovery.rs) actually run.
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/rerouter_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable @ 2026-07-21
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4      # v2.9.1
        with:
          workspaces: backend-rust
      - name: cargo fmt --check
        working-directory: backend-rust
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: backend-rust
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: backend-rust
        run: cargo test --all-targets

  frontend:
    name: frontend (typecheck + audit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020       # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: npm run build
        working-directory: frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable @ 2026-07-21
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4      # v2.9.1
        with:
          workspaces: backend-rust
      - name: cargo check embedded UI
        working-directory: backend-rust
        run: cargo check --features embed-ui
