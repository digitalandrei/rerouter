# Rerouter controller configuration. `rerouter-controller --install` writes this
# file verbatim to /srv/rerouter/config.toml (only if it does not already exist);
# if the file is missing at startup the controller falls back to built-in
# defaults that mirror this file exactly.
# Secrets (DB URL, provider tokens) come from the environment / EnvironmentFile,
# not this file. See deploy/env/rerouter.example.env.

[server]
# Localhost only — the API is public ONLY via the Nginx /api reverse proxy
# (behind Cloudflare). Never bind or expose this address directly.
bind = "127.0.0.1:9277"

[database]
# Set DATABASE_URL in the environment (mysql://user:pass@host:3306/rerouter).
url_env = "DATABASE_URL"

[auth]
# Session cookies are backed by the DB sessions table. SESSION_SECRET and
# SECRETS_KEY come from the environment; TWO_FACTOR_ISSUER=Rerouter.
session_ttl_hours = 12
# Session TTL when the user ticks "remember me" at login (default 7 days).
remember_me_ttl_hours = 168
# Failed logins (per email + real client IP) before account lockout.
lockout_threshold = 5
lockout_minutes = 15

# Email alerts are configured entirely via the environment:
# SMTP_HOST / SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM
# (see deploy/env/rerouter.example.env). No [smtp] section here.

# v1 telemetry is SNMP v2c interface polling (per-device poll interval lives on
# the device row). These are the rollup/staleness knobs for the poll loop.
[telemetry]
metrics_rollup_seconds = 15
# How often the poll loop probes device SSH reachability (a no-command liveness
# session, ~one login/logout — light on the device). Floored at 60s in code.
reachability_interval_seconds = 180
stale_after_seconds = 90
jitter_percent = 15

[detection]
default_consecutive_samples = 3
default_min_duration_seconds = 30
hysteresis_seconds = 30

[safety]
# Operating mode: "observe" (default) = safe read-only / alert-only — NO reroute
# executes, automatic or manual; rule fires alert with the actions that WOULD
# have run. "enforce" allows execution (still gated by every other safety rule).
# This is only the startup fallback: the authoritative runtime value is
# system_settings.operating_mode, changed from /settings by an admin (audited).
operating_mode = "observe"
# Master switch — automatic reroutes are OFF by default (applies in enforce mode).
automatic_actions_enabled = false
# Global circuit breaker: at most N executed actions per window (all devices).
global_action_rate_limit_count = 3
global_action_rate_limit_window_seconds = 600
# Per-rule re-fire throttle and per-device post-action throttle.
same_rule_cooldown_seconds = 900
same_device_cooldown_seconds = 300
# Crash recovery (pending/running/verifying -> uncertain + device lock) is
# non-negotiable and always runs on startup; there is intentionally no opt-out.

[reroute]
# Verify the resulting routing state after every action ("never trust 'sent'").
require_verification = true

# Retention windows (days), enforced by the controller's retention cleanup task.
# Short-term telemetry + protection history: traffic_samples, flow_buckets,
# alerts and rule_events are actively pruned. reroute_logs is advisory and NOT
# auto-pruned (the reroute action log is a low-volume safety trail whose rows are
# live state-machine state); audit_logs is likewise never auto-pruned.
[retention]
# SNMP interface history (interface_samples).
traffic_samples_days = 7
# NetFlow/sFlow aggregates (flow_*_buckets). Note: per-minute, high-cardinality
# (esp. top-talker 5-tuples) — raising this materially increases disk use.
flow_buckets_days = 7
# Alert events (alerts). Previously kept indefinitely.
alerts_days = 7
# Detection history (rule_events: matched/fired/cleared).
rule_events_days = 7
# Advisory only — the reroute action log is NOT auto-pruned (see comment above).
reroute_logs_days = 365

# NetFlow v9 / IPFIX flow collector — a SECOND, read-only telemetry source giving
# per-tuple composition SNMP cannot (see docs/flow-telemetry.md). OFF by default.
# Unlike [server].bind (loopback-only), the listener must receive UDP from the
# router, so bind_addr is operator-chosen — a deliberate, documented exposure.
[flow]
enabled = false
bind_addr = "0.0.0.0"
bind_port = 2055
# sFlow v5 listener — a SECOND decoder feeding the same buckets. Off by default;
# binds only when enabled && sflow_enabled. 6343 is sFlow's default UDP port.
sflow_enabled = false
sflow_port = 6343
# Only parse datagrams whose source IP resolves to an enrolled device.
allowlist_enrolled_only = true
# Bucket retention is unified under [retention].flow_buckets_days above.
# Aggregation bucket width (seconds) and per-bucket top-K 5-tuples retained.
bucket_seconds = 60
top_k_talkers = 100
# Fallback sampling rate when an exporter reports none and no override is set; a
# sampled-looking exporter that falls through to this is flagged low-confidence.
default_sampling_rate = 1
