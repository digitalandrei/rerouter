[package]
name = "rerouter-controller"
version = "0.1.0"
edition = "2021"
description = "Rerouter controller — traffic telemetry, DDoS detection, and safe reroute execution"
license = "proprietary"

[[bin]]
name = "rerouter-controller"
path = "src/main.rs"

[features]
default = []
# OPTIONAL single-binary UI: embed ../frontend/dist and serve the SPA from the
# controller itself (index.html fallback for client routes; /api/* always wins).
# Build: (cd frontend && npm ci && npm run build) && cargo build --release --features embed-ui
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "uuid", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
# --env-file loading at startup (process env always wins; missing file = warn).
dotenvy = "0.15"
# Single-binary UI (feature "embed-ui" only) — keep the default build free of
# any frontend/dist requirement.
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
toml = "0.8"
# Auth: Argon2id password hashing + RFC 6238 TOTP (30s / 6 digits / issuer "Rerouter").
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
rand = "0.9"
# Email alerts: SMTP over rustls only (no openssl anywhere in the tree).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname", "pool"] }
# v1 telemetry: SNMP v2c interface polling (pure-Rust async, GETBULK table walks;
# no openssl). v3 is a typed stub in this milestone.
csnmp = "0.6"
# Encryption at rest for device SNMP communities and SSH credentials
# (AES-256-GCM, key from SECRETS_KEY). Pure Rust — no openssl.
aes-gcm = "0.10"
hex = "0.4"
# Session token hashing (cookie carries the token; DB stores only the SHA-256).
sha2 = "0.10"
# Cookie max-age durations for axum-extra cookies.
time = "0.3"
russh = "0.61.2"

[dev-dependencies]
# fixtures + parser tests live under tests/
