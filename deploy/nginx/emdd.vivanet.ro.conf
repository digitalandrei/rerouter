# Rerouter vhost — emdd.vivanet.ro (dev deployment).
#
# Cloudflare DNS-only (NO proxy / grey cloud): the origin terminates TLS itself
# with a Let's Encrypt cert (certbot dns-cloudflare) and sees the REAL client IP
# directly in $remote_addr. Access is restricted to the operator network.
#
# Installed at /etc/nginx/sites-available/rerouter on the box. The canonical
# Cloudflare-fronted production example is rerouter.conf in this directory.

server {
    listen 80;
    listen [::]:80;
    server_name emdd.vivanet.ro;

    # Same allowlist on :80 so non-operator clients can't even probe.
    allow 194.140.245.0/24;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name emdd.vivanet.ro;

    # --- Access control: operator network only (for now). There is no Cloudflare
    #     proxy in front, so $remote_addr is the real client IP. ---
    allow 194.140.245.0/24;
    deny all;

    # --- TLS: Let's Encrypt (certbot dns-cloudflare); renews via cron/timer and
    #     reloads nginx (renew_hook). ---
    ssl_certificate     /etc/letsencrypt/live/emdd.vivanet.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emdd.vivanet.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:RerouterTLS:10m;
    ssl_session_tickets off;

    root /var/www/rerouter;
    index index.html;

    access_log /var/log/nginx/rerouter.access.log;
    error_log  /var/log/nginx/rerouter.error.log;

    # Baseline security headers (apply to responses without their own add_header).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    # Enable HSTS once HTTPS is confirmed permanent:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # API -> Rust controller (binds 127.0.0.1:9277 ONLY; never exposed directly).
    # The controller reads the real client IP from CF-Connecting-IP; set it to the
    # direct peer and OVERWRITE any client-supplied value (no Cloudflare proxy
    # sanitizes it here) so the source can't be spoofed for throttling/lockout/audit.
    location /api/ {
        proxy_pass http://127.0.0.1:9277;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed SPA assets (Vite content-hashed filenames): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entrypoint (also served for client-side routes via the fallback below):
    # never cache it, or clients keep stale asset hashes. Re-assert the security
    # headers since this add_header block overrides the server-level ones.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY    always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri /index.html;
    }

    # Never serve dotfiles.
    location ~ /\.(?!well-known).* { deny all; }
}
