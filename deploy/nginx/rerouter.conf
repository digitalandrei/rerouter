# Rerouter origin server. Public TLS is terminated at Cloudflare; this is the
# origin behind it (rerouter.cloudcraft.ro). See ../../docs/deployment.md.
#
# Lock down: only Cloudflare IPs should reach 443 here (enforce at the firewall
# AND below). Restore the real client IP from CF-Connecting-IP so the controller
# sees the true source for throttling, lockout, and audit.

# --- Cloudflare real-ip restoration -------------------------------------------
# Populate these from https://www.cloudflare.com/ips (keep updated; a cron/script
# can regenerate this include). Example entries only:
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 2400:cb00::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl http2;
    server_name rerouter.cloudcraft.ro;

    # Built React SPA (Vite output), served statically.
    root /var/www/rerouter/frontend/dist;
    index index.html;

    # Cloudflare Origin Certificate (SSL mode: Full (strict)).
    ssl_certificate     /etc/ssl/rerouter/origin.pem;
    ssl_certificate_key /etc/ssl/rerouter/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security response headers. X-Frame-Options in particular blocks clickjacking
    # of the reroute-trigger UI (the SPA click is now the ONLY human confirmation
    # step for a manual reroute — typed confirmation was de-scoped). Repeated in
    # `location = /index.html` below because its own add_header would drop these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # STRONGLY RECOMMENDED: allow only Cloudflare ranges (mirror set_real_ip_from)
    # and/or enforce the same at the host firewall. Without this, a direct-to-origin
    # client bypasses Cloudflare entirely. Uncomment and populate:
    # allow 173.245.48.0/20; # ... all current CF ranges ... ; deny all;

    # The Rust controller binds 127.0.0.1:9277 ONLY and is reachable exclusively
    # through this reverse proxy. Never expose it directly.
    location /api/ {
        proxy_pass http://127.0.0.1:9277;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Use $remote_addr (realip-corrected via set_real_ip_from above), NOT the
        # raw $http_cf_connecting_ip: the latter is a client-supplied header that a
        # direct-to-origin attacker can forge to spoof audit-log IPs and evade the
        # per-IP login lockout. $remote_addr is the connecting peer and cannot be
        # forged (and becomes the true client IP once set_real_ip_from is populated).
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Hashed static assets (Vite emits content-hashed filenames): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entrypoint must never be cached, or clients keep stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Re-declare security headers: a location-level add_header drops inherited ones.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA routing: unknown paths fall back to index.html (client-side router).
    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
