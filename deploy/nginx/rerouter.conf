# Rerouter origin server. Public TLS is terminated at Cloudflare; this is the
# origin behind it (rerouter.cloudcraft.ro). See ../../docs/deployment.md.
#
# Lock down: only Cloudflare IPs should reach 443 here (enforce at the firewall
# AND below). After that source ACL passes, forward Cloudflare's client-IP header
# to the controller for throttling, lockout, and audit.

# --- Cloudflare origin source ACL ---------------------------------------------
# This generated include is REQUIRED. It must contain one `allow` directive for
# every current Cloudflare IPv4/IPv6 range. Nginx fails
# configuration validation when the file is absent, which is the safe direction.
# See cloudflare-origin-ranges.conf.example and docs/deployment.md.
server {
    listen 443 ssl http2;
    server_name rerouter.cloudcraft.ro;

    # `server_name` selects a virtual host but does not itself reject an unknown
    # Host when this is the default TLS server. Prevent another Cloudflare
    # customer from pointing a proxied hostname at this origin.
    if ($host != rerouter.cloudcraft.ro) { return 444; }

    include /etc/nginx/snippets/rerouter-cloudflare-origin-ranges.conf;

    # Built React SPA (Vite output), served statically.
    root /var/www/rerouter/frontend/dist;
    index index.html;

    # Cloudflare Origin Certificate (SSL mode: Full (strict)).
    ssl_certificate     /etc/ssl/rerouter/origin.pem;
    ssl_certificate_key /etc/ssl/rerouter/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security response headers. X-Frame-Options blocks clickjacking of the
    # reroute UI. Manual actions, rule applies, and rollbacks use server-issued
    # one-use preview tokens, so the reviewed plan must not be framed deceptively.
    # Repeated below because index.html's own add_header would drop these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The required include above supplies the current Cloudflare `allow` ranges.
    # Everything else is refused even if the host firewall was misconfigured.
    deny all;

    # The Rust controller binds 127.0.0.1:9277 ONLY and is reachable exclusively
    # through this reverse proxy. Never expose it directly.
    location /api/ {
        proxy_pass http://127.0.0.1:9277;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Keep $remote_addr as the Cloudflare connection address so allow/deny
        # above remains correct. Only requests that passed that ACL reach here,
        # so Cloudflare's overwritten client header is trusted at this point.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Hashed static assets (Vite emits content-hashed filenames): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # SPA entrypoint must never be cached, or clients keep stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Re-declare security headers: a location-level add_header drops inherited ones.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA routing: unknown paths fall back to index.html (client-side router).
    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
